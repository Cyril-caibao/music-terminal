<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CyrilShield</title>
<style>
  :root{
    --bg:#0b1220; --card:#111a2b; --fg:#e7eefb; --dim:#8b9cb8;
    --line:rgba(122,162,255,.18); --accent:#3b82f6; --danger:#ff8f8f;
  }
  body.light{
    --bg:#f3f6fc; --card:#ffffff; --fg:#17233a; --dim:#5d6b83;
    --line:rgba(28,58,116,.16); --accent:#2563eb; --danger:#c02626;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--fg); font:14px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center; -webkit-font-smoothing:antialiased;
  }
  .wrap{width:min(420px,86vw); text-align:center; padding:26px 24px 22px}
  .logo{
    width:64px;height:64px;margin:0 auto 14px;border-radius:16px;background:#fff;
    display:flex;align-items:center;justify-content:center;padding:9px;
    box-shadow:0 10px 26px rgba(37,99,235,.35);
  }
  .logo img{width:100%;height:100%;object-fit:contain;display:block}
  h1{margin:0;font-size:19px;letter-spacing:.3px;font-weight:650}
  .sub{margin:2px 0 18px;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--dim)}
  #tip{margin:0 0 14px;color:var(--dim);min-height:22px}
  .bar{height:3px;border-radius:3px;background:var(--line);overflow:hidden;margin:0 0 18px}
  .bar i{display:block;height:100%;width:38%;border-radius:3px;
    background:linear-gradient(90deg,transparent,var(--accent),transparent);
    animation:run 1.15s linear infinite}
  @keyframes run{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
  .bar[hidden]{display:none}
  pre#err{
    margin:0 0 14px;padding:10px 12px;text-align:left;max-height:190px;overflow:auto;
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    color:var(--danger);font:12px/1.55 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-all
  }
  pre#err[hidden]{display:none}
  .row{display:flex;gap:9px;justify-content:center}
  .row[hidden]{display:none}
  button{
    appearance:none;border:1px solid var(--line);background:var(--card);color:var(--fg);
    padding:7px 15px;border-radius:9px;font:inherit;cursor:pointer;transition:.15s
  }
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{filter:brightness(1.08);color:#fff}
  .foot{margin-top:16px;font-size:11px;color:var(--dim)}
</style>
</head>
<body>

  <h1>CyrilShield</h1>
  <div class="sub">Toolkit</div>

  <p id="tip">正在启动内核…</p>
  <div class="bar"><i></i></div>
  <pre id="err" hidden></pre>
  <div class="row" id="acts" hidden>
    <button class="primary" id="retry">重试</button>
    <button id="log">看日志</button>
    <button id="stop">结束进程</button>
  </div>
  <div class="foot">界面由插件自带的 Python 运行，关了面板会自动退出</div>
</div>

<script>
(function () {
  "use strict";
  var tip = document.getElementById("tip");
  var bar = document.querySelector(".bar");
  var errEl = document.getElementById("err");
  var acts = document.getElementById("acts");

  /* 跟随宿主明暗 */
  function theme() {
    try {
      var l = !!(window.parent && window.parent.document &&
                 window.parent.document.body.classList.contains("light"));
      document.body.classList.toggle("light", l);
    } catch (e) { /* 跨域就保持自己的主题 */ }
  }
  theme();
  setInterval(theme, 2000);

  function show(text, detail) {
    tip.textContent = text;
    bar.hidden = true;
    acts.hidden = false;
    if (detail) { errEl.textContent = detail; errEl.hidden = false; }
  }

  function post(url, body, ms) {
    var ctl = ("AbortController" in window) ? new AbortController() : null;
    var timer = ctl ? setTimeout(function () { ctl.abort(); }, ms || 60000) : 0;
    return fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {}),
      signal: ctl ? ctl.signal : undefined
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (timer) clearTimeout(timer);
      return d;
    });
  }

  function boot() {
    tip.textContent = "正在启动内核…";
    bar.hidden = false;
    errEl.hidden = true;
    acts.hidden = true;
    post("/cs/ui/start", {}, 60000).then(function (d) {
      if (!d || !d.ok) {
        show("启动失败", (d && d.error ? d.error + "\n\n" : "") + (d && d.log ? d.log : ""));
        return;
      }
      tip.textContent = "正在进入界面…";
      setTimeout(function () { location.replace(d.url); }, 200);
    }).catch(function (e) {
      show("请求失败：" + (e && e.message ? e.message : e));
    });
  }

  document.getElementById("retry").onclick = boot;

  document.getElementById("log").onclick = function () {
    fetch("/cs/ui/log").then(function (r) { return r.json(); }).then(function (d) {
      errEl.textContent = (d && d.log) ? d.log : "（还没有日志）";
      errEl.hidden = false;
    }).catch(function (e) {
      errEl.textContent = "读日志失败：" + e.message;
      errEl.hidden = false;
    });
  };

  document.getElementById("stop").onclick = function () {
    post("/cs/ui/stop", {}).then(function () {
      show("已停止，点「重试」可以重新启动");
    }).catch(function () { show("已停止"); });
  };

  boot();
})();
</script>
</body>
</html>
